org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Kotlin 编译器以 in-process 方式运行，不启动独立 daemon。
# 原因：daemon 会在 ~/Library/Application Support/kotlin/daemon/ 写入 tsmarker
# 临时文件，该路径位于工作区之外，在受限沙箱下会抛
# FileSystemException: Operation not permitted，导致构建随机失败。
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false

# 开启代理配置，确保 Gradle 依赖秒级下载
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=1080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=1080
